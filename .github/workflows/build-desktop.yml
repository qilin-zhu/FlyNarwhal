name: Build Desktop Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            architecture: x64
            installer-arch: amd64
            artifact: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Release build without the private obfuscator: the app transparently
      # falls back to the compile-time dart-define secret bridge when the
      # fly_narwhal_obfuscator.dll is absent (lib/core/config/
      # secret_bridge_selector.dart), so a plain obfuscated Flutter build is
      # fully functional.
      - name: Read app version from pubspec
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+]+)').Matches[0].Groups[1].Value
          "APP_FULL_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build Windows bundle (release, obfuscated)
        shell: pwsh
        run: |
          flutter.bat build windows --release --obfuscate `
            --split-debug-info=symbols/windows-x64 `
            --dart-define=APP_FULL_VERSION=$env:APP_FULL_VERSION

      - name: Upload Windows build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-build-logs
          path: |
            build/windows/
            build/.last_build_id
          if-no-files-found: ignore

      - name: Package Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+]+)').Matches[0].Groups[1].Value
          iscc "/DMyAppArch=${{ matrix.installer-arch }}" "/DMyAppVersion=$version" "/DFlutterBundleDir=$PWD\\build\\windows\\${{ matrix.architecture }}\\runner\\Release" installer/setup.iss

      - name: Package Windows portable zip
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+]+)').Matches[0].Groups[1].Value
          $bundle = Join-Path $PWD "build\windows\${{ matrix.architecture }}\runner\Release"
          # The PORTABLE marker tells the running app it is a portable bundle
          # (drives update asset selection and endpoint self-registration).
          # It is written after iscc so the installer never ships it.
          Set-Content -Path (Join-Path $bundle 'PORTABLE') -Value 'portable' -Encoding ascii -NoNewline
          New-Item -ItemType Directory -Force -Path "build\portable" | Out-Null
          $zipPath = Join-Path $PWD "build\portable\FlyNarwhal_Portable_Windows_${{ matrix.installer-arch }}_$version.zip"
          Push-Location $bundle
          try {
            # Archive the bundle children at the zip root so the updater can
            # extract the archive straight over the portable directory.
            tar.exe -a -c -f $zipPath *
          } finally {
            Pop-Location
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Portable zip packaging failed with exit code $LASTEXITCODE."
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/installer/FlyNarwhal_Setup_Windows_*.exe
            build/portable/FlyNarwhal_Portable_Windows_*.zip
          if-no-files-found: error

  release:
    if: false
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release job disabled in this fork build"
